# sbx sandbox specification.
# Consumed by bin/sbx. Unknown keys are a hard error so a typo cannot
# silently weaken the sandbox.

# Read-only host paths. Order preserved. Missing paths are skipped with a
# warning; /opt is commonly absent.
ro_bind = /usr /etc /opt

# Extra writable binds beyond the project directory. Empty by default.
rw_bind =

# Read-only single files to mount. Useful for handing an agent its own config
# without exposing the directory it lives in. The parent dir is created empty.
#
# The following four lines let Crush authenticate and remember its model
# selection inside the sandbox. They are NOT enabled by default: uncommenting
# them exposes live API credentials to every command run through sbx. Enable
# them only for sessions you are willing to run with that exposure.
#
# ro_file = ~/.config/crush/crush.json
# ro_file = ~/.local/share/crush/crush.json
# ro_file = ~/.local/share/crush/providers.json
# ro_file = ~/.local/share/crush/hyper.json
ro_file =

# Read-only directory trees, for content that must be visible in full. Unlike
# ro_file, this exposes the entire subtree, so point it only at content that is
# already safe to hand to the sandboxed command. A ro_file mount of a file
# inside a directory also creates that parent as empty, so a skills directory
# needs ro_dir or the skills are invisible.
#
# ro_dir = ~/.config/crush/skills
ro_dir =

# Absolute paths to remove from the view even if reachable via a parent bind.
hide = /usr/lib/debug

# Extra environment variables inside the sandbox.
env = TERM=xterm-256color

# Namespace toggles.
unshare_pid = on
unshare_ipc = on
unshare_uts = on

# Network is intentionally left intact so package installs work.
# Set to off to unshare the network namespace as well.
network = on
