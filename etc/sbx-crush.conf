# Variant spec: the default sandbox plus Crush's own config and skills.
#
# Prefer the --agent flag over this file:
#
#   sbx run --agent <dir> -- crush
#
# --agent does everything below and additionally gives Crush a writable session
# copy of its data directory, which it needs and which a spec file cannot
# express. This file is kept as a readable example of the mount set, and for
# anyone who wants to adjust it without touching the wrapper.
#
# This exposes live API keys read-only to whatever runs inside. Use it for agent
# sessions you trust, not for untrusted code.
ro_bind = /usr /etc /opt
rw_bind =

# The config dir is read-only: Crush reads it but does not write it.
ro_file = ~/.config/crush/crush.json

# Skills are a directory tree, so they need ro_dir rather than ro_file: a
# ro_file mount creates the parent empty, which hides every skill. This exposes
# the whole skills/ tree read-only. It contains prompts and scripts, not
# credentials, but a skill's scripts are reachable by the sandboxed command.
ro_dir = ~/.config/crush/skills

# The data dir is deliberately NOT mounted here. Crush rewrites it while running
# (model selection, session state, and the locks it takes), so mounting it
# read-only fails with "device or resource busy" on the first write. --agent
# solves this by copying it to a writable temp dir; a spec cannot. Mounting it
# writable would instead let the sandboxed agent edit your real credentials and
# model selection on the host.

hide = /usr/lib/debug
env = TERM=xterm-256color
unshare_pid = on
unshare_ipc = on
unshare_uts = on
network = on
